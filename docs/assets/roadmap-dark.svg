<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="roadmap-dark-title roadmap-dark-desc" id="roadmap-dark-root">
<title id="roadmap-dark-title">Kagan release roadmap</title>
<desc id="roadmap-dark-desc">Five development stages from boot to the RISC-V and AArch64 ports, with release v1.0 after the fourth stage and v2.0 after the fifth.</desc>
<defs>
      <style>#roadmap-dark-root { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; color: #E6EDF3; }
      #roadmap-dark-root .wrap { overflow-x: auto; }
      #roadmap-dark-root .wrap { overflow-x: visible; }</style><pattern id="roadmap-dark-roadmap-dark-dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#e6edf3" fill-opacity="0.06"/></pattern><marker id="roadmap-dark-roadmap-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9DA7B3"/></marker><marker id="roadmap-dark-roadmap-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#FF7B72"/></marker></defs><rect width="100%" height="100%" fill="#0D1117"/><rect width="100%" height="100%" fill="url(#roadmap-dark-roadmap-dark-dots)"/>
<rect x="40" y="32" width="176" height="112" fill="#1C2330" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.14"/>
<text x="54" y="58" fill="#9DA7B3" font-size="8.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.10em">PHASES 0–4</text>
<text x="54" y="82" fill="#E6EDF3" font-size="14" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Boot and interrupts</text>
<text x="54" y="106" fill="#9DA7B3" font-size="9.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">GRUB, console, GDT/IDT,</text>
<text x="54" y="122" fill="#9DA7B3" font-size="9.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">PIC, timer, keyboard</text>
<rect x="216" y="32" width="176" height="112" fill="#161B22" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.14"/>
<text x="230" y="58" fill="#9DA7B3" font-size="8.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.10em">PHASES 5–7</text>
<text x="230" y="82" fill="#E6EDF3" font-size="14" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Memory management</text>
<text x="230" y="106" fill="#9DA7B3" font-size="9.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">frame allocator, paging,</text>
<text x="230" y="122" fill="#9DA7B3" font-size="9.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">higher half, kernel heap</text>
<rect x="392" y="32" width="176" height="112" fill="#1C2330" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.14"/>
<text x="406" y="58" fill="#9DA7B3" font-size="8.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.10em">PHASES 8–11</text>
<text x="406" y="82" fill="#E6EDF3" font-size="14" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Processes</text>
<text x="406" y="106" fill="#9DA7B3" font-size="9.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">scheduler, user mode,</text>
<text x="406" y="122" fill="#9DA7B3" font-size="9.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">syscalls, fork/exec, COW</text>
<rect x="568" y="32" width="176" height="112" fill="#161B22" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.14"/>
<text x="582" y="58" fill="#9DA7B3" font-size="8.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.10em">PHASES 12–15</text>
<text x="582" y="82" fill="#E6EDF3" font-size="14" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Storage and userland</text>
<text x="582" y="106" fill="#9DA7B3" font-size="9.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">ATA, VFS, KaganFS, libc,</text>
<text x="582" y="122" fill="#9DA7B3" font-size="9.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">shell, hardened release</text>
<rect x="744" y="32" width="176" height="112" fill="#1C2330" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.14"/>
<text x="758" y="58" fill="#9DA7B3" font-size="8.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.10em">PHASES 16–18</text>
<text x="758" y="82" fill="#E6EDF3" font-size="14" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Portability</text>
<text x="758" y="106" fill="#9DA7B3" font-size="9.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">architecture layer,</text>
<text x="758" y="122" fill="#9DA7B3" font-size="9.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">RISC-V and AArch64 ports</text>
<rect x="120" y="46" width="84" height="18" rx="2" fill="none" stroke="#E6EDF3" stroke-width="1"/>
<text x="162" y="59" fill="#E6EDF3" font-size="8" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">IN PROGRESS</text>
<line x1="40" y1="172" x2="920" y2="172" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.30"/>
<line x1="216" y1="168" x2="216" y2="176" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.30"/>
<line x1="392" y1="168" x2="392" y2="176" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.30"/>
<line x1="568" y1="168" x2="568" y2="176" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.30"/>
<circle cx="744" cy="172" r="6" fill="#FF7B72"/>
<text x="744" y="200" fill="#FF7B72" font-size="14" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">v1.0</text>
<text x="744" y="216" fill="#9DA7B3" font-size="9.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">i386</text>
<circle cx="920" cy="172" r="6" fill="#FF7B72"/>
<text x="920" y="200" fill="#FF7B72" font-size="14" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="end">v2.0</text>
<text x="920" y="216" fill="#9DA7B3" font-size="9.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end">i386 · RV32 · AArch64</text>
</svg>
