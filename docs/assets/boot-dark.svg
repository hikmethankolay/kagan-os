<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="boot-dark-title boot-dark-desc" id="boot-dark-root">
<title id="boot-dark-title">Kagan boot sequence</title>
<desc id="boot-dark-desc">Control passes from the BIOS to GRUB, the Multiboot loader, kmain and finally init, the first user process.</desc>
<defs>
      <style>#boot-dark-root { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; color: #E6EDF3; }
      #boot-dark-root .wrap { overflow-x: auto; }
      #boot-dark-root .wrap { overflow-x: visible; }</style><pattern id="boot-dark-boot-dark-dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#e6edf3" fill-opacity="0.06"/></pattern><marker id="boot-dark-boot-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9DA7B3"/></marker><marker id="boot-dark-boot-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#FF7B72"/></marker></defs><rect width="100%" height="100%" fill="#0D1117"/><rect width="100%" height="100%" fill="url(#boot-dark-boot-dark-dots)"/>
<line x1="120" y1="96" x2="120" y2="520" stroke="#e6edf3" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.30"/>
<line x1="300" y1="96" x2="300" y2="520" stroke="#e6edf3" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.30"/>
<line x1="480" y1="96" x2="480" y2="520" stroke="#e6edf3" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.30"/>
<line x1="660" y1="96" x2="660" y2="520" stroke="#e6edf3" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.30"/>
<line x1="840" y1="96" x2="840" y2="520" stroke="#e6edf3" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.30"/>
<rect x="116" y="120" width="8" height="40" fill="#161B22" stroke="#e6edf3" stroke-width="0.8" stroke-opacity="0.30"/>
<rect x="296" y="160" width="8" height="56" fill="#161B22" stroke="#e6edf3" stroke-width="0.8" stroke-opacity="0.30"/>
<rect x="476" y="216" width="8" height="128" fill="#161B22" stroke="#e6edf3" stroke-width="0.8" stroke-opacity="0.30"/>
<rect x="656" y="344" width="8" height="128" fill="#161B22" stroke="#e6edf3" stroke-width="0.8" stroke-opacity="0.30"/>
<rect x="836" y="472" width="8" height="32" fill="#161B22" stroke="#e6edf3" stroke-width="0.8" stroke-opacity="0.30"/>
<line x1="124" y1="160" x2="294" y2="160" stroke="#9DA7B3" stroke-width="1.2" marker-end="url(#boot-dark-boot-dark-arrow)"/><rect x="169" y="134" width="80" height="16" fill="#0D1117"/><text x="209.0" y="146" fill="#9DA7B3" font-size="9" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">BOOT DEVICE</text>
<line x1="304" y1="216" x2="474" y2="216" stroke="#9DA7B3" stroke-width="1.2" marker-end="url(#boot-dark-boot-dark-arrow)"/><rect x="340" y="190" width="99" height="16" fill="#0D1117"/><text x="389.0" y="202" fill="#9DA7B3" font-size="9" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">MULTIBOOT JUMP</text>
<text x="390" y="236" fill="#9DA7B3" font-size="10" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">EAX = 0x2BADB002, EBX = mbi</text>
<path d="M 484 264 H 512 Q 520 264 520 272 V 286 Q 520 294 512 294 H 490" fill="none" stroke="#9DA7B3" stroke-width="1.2" marker-end="url(#boot-dark-boot-dark-arrow)"/><text x="532" y="276" fill="#9DA7B3" font-size="9" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.06em">HIGHER HALF</text><text x="532" y="290" fill="#9DA7B3" font-size="10" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">paging on, kernel at 0xC0000000</text>
<line x1="484" y1="344" x2="654" y2="344" stroke="#9DA7B3" stroke-width="1.2" marker-end="url(#boot-dark-boot-dark-arrow)"/><rect x="532" y="318" width="74" height="16" fill="#0D1117"/><text x="569.0" y="330" fill="#9DA7B3" font-size="9" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">KMAIN(MBI)</text>
<path d="M 664 392 H 692 Q 700 392 700 400 V 414 Q 700 422 692 422 H 670" fill="none" stroke="#9DA7B3" stroke-width="1.2" marker-end="url(#boot-dark-boot-dark-arrow)"/><text x="712" y="404" fill="#9DA7B3" font-size="9" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.06em">BRING-UP</text><text x="712" y="418" fill="#9DA7B3" font-size="10" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">console, IDT, memory, scheduler, VFS</text>
<line x1="664" y1="472" x2="834" y2="472" stroke="#FF7B72" stroke-width="1.6" marker-end="url(#boot-dark-boot-dark-arrow-accent)"/><rect x="709" y="446" width="80" height="16" fill="#0D1117"/><text x="749.0" y="458" fill="#FF7B72" font-size="9" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">START PID 1</text>
<rect x="48" y="40" width="144" height="56" rx="6" fill="#1C2330" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.30"/>
<text x="120" y="66" fill="#E6EDF3" font-size="14" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">BIOS</text>
<text x="120" y="84" fill="#9DA7B3" font-size="9" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">SeaBIOS in QEMU</text>
<rect x="228" y="40" width="144" height="56" rx="6" fill="#1C2330" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.30"/>
<text x="300" y="66" fill="#E6EDF3" font-size="14" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">GRUB 2</text>
<text x="300" y="84" fill="#9DA7B3" font-size="9" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">boot/grub.cfg</text>
<rect x="408" y="40" width="144" height="56" rx="6" fill="#1C2330" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.30"/>
<text x="480" y="66" fill="#E6EDF3" font-size="14" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">loader.s</text>
<text x="480" y="84" fill="#9DA7B3" font-size="9" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Multiboot entry</text>
<rect x="588" y="40" width="144" height="56" rx="6" fill="#1C2330" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.30"/>
<text x="660" y="66" fill="#E6EDF3" font-size="14" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">kmain</text>
<text x="660" y="84" fill="#9DA7B3" font-size="9" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">kernel/kmain.c</text>
<rect x="768" y="40" width="144" height="56" rx="6" fill="#ff7b72" stroke="#FF7B72" stroke-width="1" fill-opacity="0.10"/>
<text x="840" y="66" fill="#E6EDF3" font-size="14" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">init</text>
<text x="840" y="84" fill="#9DA7B3" font-size="9" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">PID 1, ring 3</text>
<line x1="40" y1="544" x2="920" y2="544" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.14"/>
<line x1="40" y1="564" x2="72" y2="564" stroke="#9DA7B3" stroke-width="1.2" marker-end="url(#boot-dark-boot-dark-arrow)"/>
<text x="84" y="568" fill="#9DA7B3" font-size="11" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Control passes to the next stage</text>
<line x1="340" y1="564" x2="372" y2="564" stroke="#FF7B72" stroke-width="1.6" marker-end="url(#boot-dark-boot-dark-arrow-accent)"/>
<text x="384" y="568" fill="#9DA7B3" font-size="11" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">First user process: the system is up</text>
</svg>
