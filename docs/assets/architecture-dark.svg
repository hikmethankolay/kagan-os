<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-dark-title architecture-dark-desc" id="architecture-dark-root">
<title id="architecture-dark-title">Kagan 1.0 kernel layers</title>
<desc id="architecture-dark-desc">Six layers from user space down to hardware, with the system call boundary highlighted as the place every user pointer is checked.</desc>
<defs>
      <style>#architecture-dark-root { font-family: system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; color: #E6EDF3; }
      #architecture-dark-root .wrap { overflow-x: auto; }
      #architecture-dark-root .wrap { overflow-x: visible; }</style><pattern id="architecture-dark-architecture-dark-dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#e6edf3" fill-opacity="0.06"/></pattern><marker id="architecture-dark-architecture-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9DA7B3"/></marker><marker id="architecture-dark-architecture-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#FF7B72"/></marker></defs><rect width="100%" height="100%" fill="#0D1117"/><rect width="100%" height="100%" fill="url(#architecture-dark-architecture-dark-dots)"/>
<rect x="160" y="72" width="760" height="72" fill="#1C2330"/>
<line x1="160" y1="144" x2="920" y2="144" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.14"/>
<text x="180" y="112" fill="#9DA7B3" font-size="9" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.14em">L6</text>
<text x="224" y="104" fill="#E6EDF3" font-size="16" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">User space</text>
<text x="224" y="124" fill="#9DA7B3" font-size="10" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">init · kash shell · coreutils · Kagan libc · ELF programs</text>
<text x="900" y="104" fill="#9DA7B3" font-size="10" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" letter-spacing="0.06em">P10 – P14</text>
<rect x="160" y="144" width="760" height="72" fill="#ff7b72" fill-opacity="0.10"/>
<rect x="160" y="144" width="760" height="72" fill="none" stroke="#FF7B72" stroke-width="1.5"/>
<text x="180" y="184" fill="#FF7B72" font-size="9" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.14em">L5</text>
<text x="224" y="176" fill="#E6EDF3" font-size="16" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">System call boundary</text>
<text x="224" y="196" fill="#9DA7B3" font-size="10" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">int 0x80 · every user pointer through uaccess.c · copy once, then check</text>
<text x="900" y="176" fill="#FF7B72" font-size="10" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" letter-spacing="0.06em">P10 – P11</text>
<rect x="160" y="216" width="760" height="72" fill="#1C2330"/>
<line x1="160" y1="288" x2="920" y2="288" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.14"/>
<text x="180" y="256" fill="#9DA7B3" font-size="9" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.14em">L4</text>
<text x="224" y="248" fill="#E6EDF3" font-size="16" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Kernel services</text>
<text x="224" y="268" fill="#9DA7B3" font-size="10" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">processes + scheduler · PMM, VMM, heap, COW · VFS + KaganFS · locks</text>
<text x="900" y="248" fill="#9DA7B3" font-size="10" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" letter-spacing="0.06em">P5 – P14</text>
<rect x="160" y="288" width="760" height="72" fill="#161B22"/>
<line x1="160" y1="360" x2="920" y2="360" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.14"/>
<text x="180" y="328" fill="#9DA7B3" font-size="9" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.14em">L3</text>
<text x="224" y="320" fill="#E6EDF3" font-size="16" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Drivers</text>
<text x="224" y="340" fill="#9DA7B3" font-size="10" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">VGA · serial · keyboard · PIT · tty · ATA · block layer · buffer cache</text>
<text x="900" y="320" fill="#9DA7B3" font-size="10" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" letter-spacing="0.06em">P2 · P4 · P12</text>
<rect x="160" y="360" width="760" height="72" fill="#1C2330"/>
<line x1="160" y1="432" x2="920" y2="432" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.14"/>
<text x="180" y="400" fill="#9DA7B3" font-size="9" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.14em">L2</text>
<text x="224" y="392" fill="#E6EDF3" font-size="16" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Architecture layer</text>
<text x="224" y="412" fill="#9DA7B3" font-size="10" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">i386: Multiboot, GDT/IDT, PIC, TSS, paging · later riscv32, aarch64</text>
<text x="900" y="392" fill="#9DA7B3" font-size="10" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" letter-spacing="0.06em">P1 – P10 · P16+</text>
<rect x="160" y="432" width="760" height="72" fill="#161B22"/>
<text x="180" y="472" fill="#9DA7B3" font-size="9" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.14em">L1</text>
<text x="224" y="464" fill="#E6EDF3" font-size="16" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">Hardware</text>
<text x="224" y="484" fill="#9DA7B3" font-size="10" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">QEMU PC: CPU, RAM, 8259 PIC, 8254 PIT, IDE disk, 16550 UART</text>
<text x="900" y="464" fill="#9DA7B3" font-size="10" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" letter-spacing="0.06em">QEMU or a real PC</text>
<rect x="160" y="72" width="760" height="432" fill="none" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.30"/>
<path d="M 148 78 H 140 V 138 H 148" fill="none" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.30"/><text x="132" y="111" fill="#9DA7B3" font-size="9" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" letter-spacing="0.14em">RING 3</text>
<path d="M 148 150 H 140 V 426 H 148" fill="none" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.30"/><text x="132" y="291" fill="#9DA7B3" font-size="9" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" letter-spacing="0.14em">RING 0</text>
<path d="M 148 438 H 140 V 498 H 148" fill="none" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.30"/><text x="132" y="471" fill="#9DA7B3" font-size="9" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end" letter-spacing="0.14em">HW</text>
<line x1="160" y1="532" x2="920" y2="532" stroke="#e6edf3" stroke-width="1" stroke-opacity="0.14"/>
<text x="160" y="556" fill="#FF7B72" font-size="9" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start" letter-spacing="0.16em">FOCAL LAYER</text>
<text x="264" y="556" fill="#9DA7B3" font-size="12" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start" font-style="italic">Every system call crosses here; the rest of the kernel never touches a user address directly.</text>
</svg>
